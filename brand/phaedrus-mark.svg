<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Phaedrus">
  <!-- Phaedrus mark: the Greek letter Phi (Φ). Even stroke weight, modest symmetric
       overshoot. Pine green #3f7355. Pure mark on transparent, recolour as needed. -->
  <circle cx="50" cy="50" r="27" fill="none" stroke="#3f7355" stroke-width="4.5"/>
  <line x1="50" y1="17" x2="50" y2="83" stroke="#3f7355" stroke-width="4.5" stroke-linecap="round"/>
</svg>
